{% load i18n %}<form class="card card-body mb-3 no-print"><div class="row g-2 align-items-end">
  <div class="col-6 col-md-3"><label class="form-label">{{ form.date_from.label }}</label>{{ form.date_from }}</div>
  <div class="col-6 col-md-3"><label class="form-label">{{ form.date_to.label }}</label>{{ form.date_to }}</div>
  <div class="col-md-2"><button class="btn btn-outline-primary w-100"><i class="bi bi-arrow-repeat"></i> {% trans "Show" %}</button></div>
  <div class="col-md-4 text-md-end"><button type="button" class="btn btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer"></i> {% trans "Print" %}</button></div>
</div></form>
