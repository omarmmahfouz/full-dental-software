{% load i18n %}{% if d.location %}<div class="scan-location small mt-1" dir="ltr">{% if d.location_is_link %}<a href="{{ d.location }}" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> {% trans "Open the scan" %}</a>{% else %}<i class="bi bi-folder2-open text-warning"></i> <code>{{ d.location }}</code> <button type="button" class="btn btn-sm btn-link p-0 align-baseline" data-copy="{{ d.location }}" data-tip="{% trans 'Copy, then paste it in the viewer or in File Explorer' %}" aria-label="{% trans 'Copy' %}"><i class="bi bi-clipboard"></i></button>{% endif %}</div>{% endif %}
