<a class="nav-link position-relative" href="{% url 'core:notifications' %}" title="{% trans 'Notifications' %}" aria-label="{% trans 'Notifications' %}" data-bell><i class="bi bi-bell fs-5"></i>{% if unread_notifications %}<span class="badge rounded-pill bg-danger notif-badge">{{ unread_notifications }}</span>{% endif %}</a>
