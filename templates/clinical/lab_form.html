{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block extra_js %}
<script>
  // The shade list follows the shade guide (VITA classical or 3D-Master).
  (function () {
    var guide = document.querySelector("[data-shade-guide]"), shade = document.querySelector("[data-shade]");
    if (!guide || !shade) return;
    function filter() {
      var label = guide.value ? guide.options[guide.selectedIndex].text : "";
      Array.prototype.forEach.call(shade.querySelectorAll("optgroup"), function (group) {
        group.hidden = !!label && group.label !== label;
        group.disabled = group.hidden;
      });
      var chosen = shade.options[shade.selectedIndex];
      if (chosen && chosen.parentNode.disabled) shade.value = "";
    }
    guide.addEventListener("change", filter);
    shade.addEventListener("change", function () {
      if (guide.value || !shade.value) return;  // choosing a shade first picks its guide
      var group = shade.options[shade.selectedIndex].parentNode;
      Array.prototype.forEach.call(guide.options, function (o) { if (o.text === group.label) guide.value = o.value; });
    });
    filter();
  })();
</script>
{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="bi bi-box-seam"></i> {{ title }}</h1></div>
<div class="card"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    <input type="hidden" name="patient" value="{% firstof request.GET.patient request.POST.patient %}">
    <input type="hidden" name="appointment" value="{% firstof request.GET.appointment request.POST.appointment %}">
    {% include "includes/form_fields.html" %}
    <div class="mt-2 d-flex gap-2 flex-wrap">
      {% if object %}
        <button class="btn btn-primary px-4"><i class="bi bi-check2-circle"></i> {% trans "Save" %}</button>
      {% else %}
        <button class="btn btn-primary px-4" name="submit_for_review" value="1"><i class="bi bi-send-check"></i> {% trans "Save and send" %}</button>
        <button class="btn btn-outline-primary"><i class="bi bi-save"></i> {% trans "Save as draft" %}</button>
      {% endif %}
      <a class="btn btn-outline-secondary" href="{% firstof request.META.HTTP_REFERER "/" %}">{% trans "Cancel" %}</a>
    </div>
  </form>
</div></div>
{% endblock %}
