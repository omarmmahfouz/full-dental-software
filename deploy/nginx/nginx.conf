# nginx in front of the system (docker-compose; see docs/deployment.md, "Many photos and many users").
# - It sends photos, X-rays and other uploaded files itself, after the system has checked who may open
#   them (the system answers with "X-Accel-Redirect: /protected-media/..."), so the Python workers stay
#   free for the pages.
# - It compresses the pages, so they reach the tablets faster over Wi-Fi.
# The workers run as "nginx" in the group "root": the system writes the uploaded files as root with
# mode 640 (not readable by other users), and the group lets nginx read them.
user  nginx root;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    server {
        listen 80 default_server;
        # Clinical videos can be up to 300 MB (photos 25 MB).
        client_max_body_size 320m;

        # Only reachable through X-Accel-Redirect from the system, never typed in a browser.
        location /protected-media/ {
            internal;
            alias /media/;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
