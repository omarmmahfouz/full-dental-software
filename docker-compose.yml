# On-premise deployment on the clinic server (no cloud).
#   1. cp .env.example .env   (then edit it)
#   2. docker compose up -d --build
#   3. docker compose exec web python manage.py createsuperuser
# The system is then at http://<server-ip>/ on the clinic network.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dental}
      POSTGRES_USER: ${DB_USER:-dental}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      MEDIA_ROOT: /app/data/media
    volumes:
      - ./data/media:/app/data/media
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy

  # Daily reminders (overdue complaints, late lab work) at 07:00 Cairo time.
  reminders:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      TZ: Africa/Cairo
    entrypoint: ["sh", "-c", "while true; do if [ \"$$(date +%H)\" = \"07\" ]; then python manage.py send_reminders; sleep 3600; fi; sleep 600; done"]
    depends_on:
      db:
        condition: service_healthy

  # Nightly database backup, kept for 30 days in ./backups (copy that folder
  # and ./data/media to an external disk regularly).
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-dental}
      PGUSER: ${DB_USER:-dental}
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Africa/Cairo
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do pg_dump -Fc -f /backups/dental-$$(date +%Y-%m-%d).dump && find /backups -name 'dental-*.dump' -mtime +30 -delete; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
