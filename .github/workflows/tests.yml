name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env: {DJANGO_DEBUG: "1"}
      - run: python manage.py test apps
        env: {DJANGO_DEBUG: "1"}
      # The Paper Reader (reader/), a separate program with its own requirements and tests.
      - run: pip install -r reader/requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        working-directory: reader
        env: {READER_DEBUG: "1"}
      - run: python manage.py test reading
        working-directory: reader
        env: {READER_DEBUG: "1"}
